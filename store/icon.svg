<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <defs>
    <linearGradient id="ground" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#4762EE"/>
      <stop offset="1" stop-color="#2733BE"/>
    </linearGradient>
    <radialGradient id="lift" cx="0.22" cy="0.14" r="0.85">
      <stop offset="0" stop-color="#9DAEFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#9DAEFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steel" gradientUnits="userSpaceOnUse" x1="0" y1="36" x2="0" y2="72">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F3F6FD"/>
      <stop offset="1" stop-color="#D3DBF0"/>
    </linearGradient>
    <filter id="cast" filterUnits="userSpaceOnUse" x="0" y="0" width="108" height="108">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.6"/>
      <feOffset dy="2.2" result="o"/>
      <feFlood flood-color="#101C6B" flood-opacity="0.42"/>
      <feComposite in2="o" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g id="bg">
    <rect width="108" height="108" fill="url(#ground)"/>
    <rect width="108" height="108" fill="url(#lift)"/>
  </g>

  <g id="fg" filter="url(#cast)">
    <path d="M27 63 L45 63 L63 45 L81 45" fill="none" stroke="url(#steel)"
          stroke-width="14" stroke-linecap="butt" stroke-linejoin="round"/>
    <path d="M27 59.6 L43.6 59.6 L61.6 41.6 L81 41.6" fill="none" stroke="#FFFFFF"
          stroke-opacity="0.55" stroke-width="2.6" stroke-linecap="butt" stroke-linejoin="round"/>
  </g>

  <g id="mono">
    <path d="M27 63 L45 63 L63 45 L81 45" fill="none" stroke="#000000"
          stroke-width="14" stroke-linecap="butt" stroke-linejoin="round"/>
  </g>
</svg>
