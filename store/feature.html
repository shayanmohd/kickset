<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Archivo Narrow"; src: url("fonts/ArchivoNarrow-SemiBold.ttf"); font-weight: 600; }
@font-face { font-family: "Archivo"; src: url("fonts/Archivo-Medium.ttf"); font-weight: 500; }
html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
body { background: linear-gradient(135deg, #4762EE 0%, #2733BE 100%); position: relative;
       font-family: "Archivo", sans-serif; }
.lift { position: absolute; inset: 0;
        background: radial-gradient(circle at 16% 10%, rgba(157,174,255,0.34), rgba(157,174,255,0) 62%); }
.mark { position: absolute; left: 72px; top: 113px; width: 402px; height: 276px; }
.name { position: absolute; left: 524px; top: 158px; font-family: "Archivo Narrow", sans-serif;
        font-weight: 600; font-size: 122px; line-height: 1; letter-spacing: -1.5px; color: #FFFFFF; }
.line { position: absolute; left: 528px; top: 302px; width: 452px; font-size: 31px; font-weight: 500;
        line-height: 1.3; color: #D8DEFC; }
</style></head>
<body>
<div class="lift"></div>
<svg class="mark" viewBox="19 30 70 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="steel" gradientUnits="userSpaceOnUse" x1="0" y1="36" x2="0" y2="72">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F3F6FD"/>
      <stop offset="1" stop-color="#D3DBF0"/>
    </linearGradient>
    <filter id="cast" filterUnits="userSpaceOnUse" x="0" y="0" width="108" height="108">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.6"/>
      <feOffset dy="2.2" result="o"/>
      <feFlood flood-color="#101C6B" flood-opacity="0.42"/>
      <feComposite in2="o" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#cast)">
    <path d="M27 63 L45 63 L63 45 L81 45" fill="none" stroke="url(#steel)"
          stroke-width="14" stroke-linecap="butt" stroke-linejoin="round"/>
    <path d="M27 59.6 L43.6 59.6 L61.6 41.6 L81 41.6" fill="none" stroke="#FFFFFF"
          stroke-opacity="0.55" stroke-width="2.6" stroke-linecap="butt" stroke-linejoin="round"/>
  </g>
</svg>
<div class="name">Kickset</div>
<div class="line">Takeouts, offsets and wrap templates, offline</div>
</body></html>
